<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel | HL GARAGEM</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syncopate:wght@700&display=swap">
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/admin.css">
</head>
<body class="adm">
<div id="login-view" class="login" hidden>
  <form id="login-form" class="login-card" novalidate>
    <a class="logo" href="/"><span class="logo-mark">HL</span><span class="logo-text">GARAGEM</span></a>
    <h1>Entrar no painel</h1>
    <label class="field"><span>Usuário</span><input id="l-user" type="text" autocomplete="username" required></label>
    <label class="field"><span>Senha</span><input id="l-pass" type="password" autocomplete="current-password" required></label>
    <p class="form-error" id="login-error" role="alert" hidden></p>
    <button class="btn btn-primary btn-block" type="submit" id="login-btn">Entrar</button>
    <p class="hint">Acesso restrito a quem administra a HL GARAGEM.</p>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="side" id="side">
    <a class="logo" href="/" target="_blank" rel="noopener"><span class="logo-mark">HL</span><span class="logo-text">GARAGEM</span></a>
    <nav class="side-nav" id="side-nav" aria-label="Painel">
      <button type="button" data-view="overview" class="on">Visão geral</button>
      <button type="button" data-view="leads">Leads <b class="badge" id="b-leads" hidden></b></button>
      <button type="button" data-view="bookings">Agendamentos</button>
      <button type="button" data-view="clients">Clientes</button>
      <button type="button" data-view="services">Serviços</button>
      <button type="button" data-view="messages">Mensagens <b class="badge" id="b-msgs" hidden></b></button>
      <button type="button" data-view="settings">Configurações</button>
    </nav>
    <div class="side-foot">
      <span id="who"></span>
      <button type="button" class="link-btn" id="logout">Sair</button>
    </div>
  </aside>
  <div class="main">
    <header class="bar">
      <button type="button" class="menu-btn adm-menu" id="adm-menu" aria-label="Abrir menu" aria-expanded="false"><span></span><span></span></button>
      <h1 id="view-title">Visão geral</h1>
      <button type="button" class="btn btn-ghost btn-sm" id="refresh">Atualizar</button>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="/art.js"></script>
<script src="/admin.js"></script>
</body>
</html>
